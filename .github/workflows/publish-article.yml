# .github/workflows/publish-article.yml
# Pipeline SEO automatisé — publie un article par jour à 8h (Paris)

name: 📝 SEO Article Pipeline

on:
  # Cron quotidien à 6h UTC (8h Paris)
  schedule:
    - cron: "0 6 * * *"

  # Permet aussi le déclenchement manuel
  workflow_dispatch:
    inputs:
      force_category:
        description: "Forcer une catégorie (dating, sorties, lifestyle, buzz)"
        required: false
        type: string

# Permissions pour push dans le repo
permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run SEO Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: true
        run: npm run pipeline

      - name: 📊 Check results
        run: |
          echo "=== Articles publiés ==="
          cat blog/articles.json | head -50
          echo ""
          echo "=== Fichiers blog ==="
          ls -la blog/
          echo ""
          echo "=== Sitemap ==="
          cat sitemap.xml
