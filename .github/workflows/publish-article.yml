# .github/workflows/publish-article.yml
# Pipeline SEO Buzz v2 — article basé sur les vraies tendances, toutes les 3h

name: 📝 SEO Buzz Pipeline v2

on:
  # Toutes les 3 heures
  schedule:
    - cron: "0 */3 * * *"

  # Déclenchement manuel
  workflow_dispatch: {}

# Permissions pour push dans le repo
permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run SEO Buzz Pipeline v2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          CI: true
        run: npm run pipeline

      - name: 📊 Check results
        run: |
          echo "=== Articles publiés ==="
          cat blog/articles.json 2>/dev/null | head -50 || echo "Pas encore d'articles"
          echo ""
          echo "=== Fichiers blog ==="
          ls -la blog/
          echo ""
          echo "=== Sitemap ==="
          cat sitemap.xml 2>/dev/null || echo "Pas encore de sitemap"
